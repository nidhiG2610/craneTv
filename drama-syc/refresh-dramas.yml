# ─────────────────────────────────────────────────────────────────────────────
# CraneTV — Weekly Drama Data Refresh
# Runs every Sunday at midnight UTC
# Also can be triggered manually from GitHub Actions tab
# ─────────────────────────────────────────────────────────────────────────────
name: Refresh Drama Data

on:
  schedule:
    - cron: '0 0 * * 0'     # Every Sunday at 00:00 UTC
  workflow_dispatch:          # Allow manual trigger from GitHub UI

jobs:
  refresh:
    name: Fetch & Commit Drama Data
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repo
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Run the fetch script
      #    VITE_TMDB_TOKEN is stored as a GitHub Secret
      - name: Fetch drama data from TMDB
        env:
          VITE_TMDB_TOKEN: ${{ secrets.VITE_TMDB_TOKEN }}
        run: node scripts/fetchDramas.js

      # 4. Check if JSON files changed
      - name: Check for changes
        id: changes
        run: |
          git diff --quiet public/data/ || echo "changed=true" >> $GITHUB_OUTPUT

      # 5. Commit and push updated JSON files
      - name: Commit updated drama data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "CraneTV Bot"
          git config user.email "bot@cranetv.com"
          git add public/data/
          git commit -m "🦢 Weekly drama data refresh — $(date -u '+%Y-%m-%d')"
          git push

      # 6. No changes — skip commit
      - name: No changes detected
        if: steps.changes.outputs.changed != 'true'
        run: echo "✅ Drama data is already up to date. No commit needed."
